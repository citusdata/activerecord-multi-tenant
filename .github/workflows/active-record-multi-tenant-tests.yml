name: Active Record Multi-Tenant Tests

env:
  CI: true
on:
  push:
    branches:
      - "**"
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Rubocop static code analysis
        run: bundle exec rubocop
  doc_checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - uses: actions/checkout@v4
    - name: Install python dependencies
      run: |
        pip install -r docs/requirements.txt
    - name: Documentation Checks
      run: |
        cd docs
        sphinx-build -W -b html source builds

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        appraisal:
          - rails_6.0
          - rails_6.1
          - rails_7.0
          - rails_7.1
          - rails_7.2
          - rails_8.0
          - rails_8.1
          - active_record_6.0
          - active_record_6.1
          - active_record_7.0
          - active_record_7.1
          - active_record_7.2
          - active_record_8.0
          - active_record_8.1
        citus_version:
          - '10'
          - '11'
          - '12'
        # Combinations Rails itself does not support: 7.2 needs Ruby 3.1+,
        # 8.x needs Ruby 3.2+, and 6.x does not run on Ruby 3.4.
        exclude:
          - ruby: '3.0'
            appraisal: rails_7.2
          - ruby: '3.0'
            appraisal: active_record_7.2
          - ruby: '3.0'
            appraisal: rails_8.0
          - ruby: '3.0'
            appraisal: active_record_8.0
          - ruby: '3.0'
            appraisal: rails_8.1
          - ruby: '3.0'
            appraisal: active_record_8.1
          - ruby: '3.1'
            appraisal: rails_8.0
          - ruby: '3.1'
            appraisal: active_record_8.0
          - ruby: '3.1'
            appraisal: rails_8.1
          - ruby: '3.1'
            appraisal: active_record_8.1
          - ruby: '3.4'
            appraisal: rails_6.0
          - ruby: '3.4'
            appraisal: active_record_6.0
          - ruby: '3.4'
            appraisal: rails_6.1
          - ruby: '3.4'
            appraisal: active_record_6.1

    name: Ruby ${{ matrix.ruby }} / ${{ matrix.appraisal }} / Citus ${{ matrix.citus_version }}
    env:
       BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
       CITUS_VERSION: ${{ matrix.citus_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Citus Database environment
        run: docker compose up -d

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Execute tests
        run: bundle exec rake spec

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
